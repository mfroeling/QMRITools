<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="680" height="530" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b5cad"/></marker>
  </defs>
  <rect width="680" height="530" rx="8" fill="#ffffff"/>
  <g font-size="12.5" fill="#1f2933" text-anchor="middle">
    <!-- main column -->
    <g fill="#f4f6f9" stroke="#c9d2dc">
      <rect x="110" y="20" width="300" height="50" rx="6"/>
      <rect x="110" y="100" width="300" height="50" rx="6"/>
      <rect x="110" y="180" width="300" height="50" rx="6"/>
      <rect x="110" y="370" width="300" height="50" rx="6"/>
      <rect x="110" y="450" width="300" height="50" rx="6"/>
    </g>
    <path d="M260,260 L370,300 L260,340 L150,300 z" fill="#e3edf8" stroke="#0b5cad"/>
    <rect x="470" y="275" width="180" height="50" rx="6" fill="#f4f6f9" stroke="#c9d2dc"/>

    <g font-weight="600">
      <text x="260" y="41">For each subject and session</text>
      <text x="260" y="121">Read the config</text>
      <text x="260" y="201">For each dataset in the config</text>
      <text x="260" y="296">Check file</text>
      <text x="260" y="313">says done?</text>
      <text x="260" y="391">Do the work</text>
      <text x="260" y="471">Write the check file</text>
      <text x="560" y="296">Skip</text>
    </g>
    <g font-size="11.5" fill="#5f6c7b">
      <text x="260" y="59">all, or the ones in ProcessSubjects</text>
      <text x="260" y="139">plus the subject's own config.json, if there is one</text>
      <text x="260" y="219">for example the Dixon scans, then the DTI scans</text>
      <text x="260" y="409">write the results, each with a json of the settings</text>
      <text x="260" y="489">done, or error when an input was missing</text>
      <text x="560" y="314">nothing is redone</text>
    </g>

    <!-- arrows -->
    <g stroke="#0b5cad" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M260,70 V98"/>
      <path d="M260,150 V178"/>
      <path d="M260,230 V258"/>
      <path d="M260,340 V368"/>
      <path d="M260,420 V448"/>
      <path d="M370,300 H468"/>
      <path d="M560,275 V205 H412"/>
      <path d="M110,475 H70 V205 H108"/>
    </g>
    <g font-size="11.5" fill="#0b5cad">
      <text x="276" y="359" text-anchor="start">no</text>
      <text x="418" y="292">yes</text>
      <text x="490" y="198">next dataset</text>
      <text x="58" y="340" transform="rotate(-90 58 340)">next dataset</text>
    </g>

    <!-- log -->
    <rect x="470" y="400" width="180" height="100" rx="6" fill="#fff6e5" stroke="#f0b429"/>
    <text x="560" y="424" font-weight="600">Log file</text>
    <g font-size="11.5" fill="#5f6c7b">
      <text x="560" y="444">one per subject and step,</text>
      <text x="560" y="461">says what was done</text>
      <text x="560" y="478">and what went wrong</text>
    </g>
  </g>
</svg>
