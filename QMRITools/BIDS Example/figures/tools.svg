<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="680" height="340" rx="8" fill="#ffffff"/>
  <g font-size="12.5" fill="#1f2933" text-anchor="middle">
    <!-- GUI -->
    <rect x="190" y="20" width="300" height="50" rx="6" fill="#e3edf8" stroke="#0b5cad"/>
    <text x="340" y="42" font-family="Consolas, Menlo, monospace" font-weight="600" fill="#0b5cad">MuscleBidsGUI[dir]</text>
    <text x="340" y="60" font-size="11.5" fill="#5f6c7b">one window with three tabs</text>
    <path d="M340,70 V90 M120,90 H560 M120,90 V110 M340,90 V110 M560,90 V110" stroke="#0b5cad" stroke-width="1.6" fill="none"/>

    <!-- columns -->
    <g fill="#f4f6f9" stroke="#c9d2dc">
      <rect x="20" y="110" width="200" height="190" rx="6"/>
      <rect x="240" y="110" width="200" height="190" rx="6"/>
      <rect x="460" y="110" width="200" height="190" rx="6"/>
    </g>
    <g fill="#e3edf8">
      <rect x="21" y="111" width="198" height="44" rx="5"/>
      <rect x="241" y="111" width="198" height="44" rx="5"/>
      <rect x="461" y="111" width="198" height="44" rx="5"/>
    </g>
    <g font-weight="600">
      <text x="120" y="130">Run</text>
      <text x="340" y="130">Config</text>
      <text x="560" y="130">Check</text>
    </g>
    <g font-size="11.5" fill="#5f6c7b">
      <text x="120" y="147">the steps, in this order</text>
      <text x="340" y="147">before processing</text>
      <text x="560" y="147">after or between steps</text>
    </g>
    <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#1f2933">
      <text x="120" y="178">BidsDcmToNii</text>
      <text x="120" y="196">MuscleBidsConvert</text>
      <text x="120" y="214">MuscleBidsProcess</text>
      <text x="120" y="232">MuscleBidsMerge</text>
      <text x="120" y="250">MuscleBidsSegment</text>
      <text x="120" y="268">MuscleBidsTractography</text>
      <text x="120" y="286">MuscleBidsAnalysis</text>

      <text x="340" y="178" fill="#0b5cad">= MuscleBidsConfig</text>
      <text x="340" y="204">ViewConfig</text>
      <text x="340" y="222">CheckCustomConfigs</text>
      <text x="340" y="240">CheckConfigLabels</text>
      <text x="340" y="258">ViewProtocolNames</text>

      <text x="560" y="178" fill="#0b5cad">= MuscleBidsCheck</text>
      <text x="560" y="204">CheckBidsOutput</text>
      <text x="560" y="222">ManageCheckFiles</text>
      <text x="560" y="240">Report tab:</text>
      <text x="560" y="258">MuscleBidsReport</text>
    </g>
    <text x="340" y="326" font-size="11.5" fill="#5f6c7b">Every name is also a function that you can call by itself in a notebook or a script.</text>
  </g>
</svg>
